name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          target-branch: master

      - name: Upload release tag
        run: echo "${{ steps.release.outputs.tag_name }}" > tag.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-tag
          path: tag.txt
          overwrite: true
          compression-level: 0

    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
      release_created: ${{ steps.release.outputs.release_created }}
