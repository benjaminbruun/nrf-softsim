# Report battery SoC via the Memfault battery metrics component.
# The Thingy:91 board init already enables the ADP536x fuel gauge
# (CONFIG_ADP536X defaults to y from the adi,adp5360 devicetree node).
CONFIG_MEMFAULT_METRICS_BATTERY_ENABLE=y
CONFIG_ADP536X=y
