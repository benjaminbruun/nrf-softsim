# Battery metrics from the nPM1300. This is the only switch needed: the board
# DT enables npm1300_charger (NPM13XX_CHARGER defaults y), and Memfault's
# npm13xx battery port (MEMFAULT_NRF_PLATFORM_BATTERY_NPM13XX) defaults y on
# this board once the fuel-gauge lib is in, selecting
# MEMFAULT_METRICS_BATTERY_ENABLE. App side: src/fuel_gauge.c.
CONFIG_NRF_FUEL_GAUGE=y
