# --- SoftSIM profile source -------------------------------------------------
# Default: EXTERNAL - the device waits for a profile over serial on first boot,
# provisions it, then reboots.
#
# For STATIC mode, uncomment the two lines below and replace the profile string with
# your Onomondo SoftSIM profile (hex string, as printed by `./softsim next` of the SoftSIM CLI Tool).
# CONFIG_SOFTSIM_STATIC_PROFILE_ENABLE=y
# CONFIG_SOFTSIM_STATIC_PROFILE="01120809101010325476980214980010325476981032140320000000000000000000000000000000000420000102030405060708090A0B0C0D0E0F0520000102030405060708090A0B0C0D0E0F0620000102030405060708090A0B0C0D0E0F"

# Thingy:91 X and other MCUboot-serial-recovery-only targets are flashed with
# dfu_application.zip, which covers just the application slot - the bundled
# SoftSIM template partition never reaches the device. Embed the template in
# the app and seed nvs_storage on first boot so provisioning can run.
CONFIG_SOFTSIM_EMBED_TEMPLATE=y

# Configured to allow a reboot following the provisioning of a profile
CONFIG_REBOOT=y

# SoftSIM debug logging: full firehose on purpose - this is a stress/soak
# build and the point is to get as many SoftSIM logs into Memfault as possible.
# LIBS also bumps LOG_BUFFER_SIZE to 16384; expect ring wrap during SIM init.
CONFIG_SOFTSIM_NRF_DEBUG_LOGS=y
CONFIG_SOFTSIM_LIBS_DEBUG_LOGS=y

# Report onomondo-uicc SS_LOGP errors as Memfault trace events
# (reason: softsim_uicc_error, defined in config/memfault_trace_reason_user_config.def)
CONFIG_SOFTSIM_MEMFAULT_TRACE=y

# SoftSIM operation heartbeat metrics (APDU/auth counts, NVS I/O, lifecycle);
# keys defined in config/memfault_metrics_heartbeat_config.def
CONFIG_SOFTSIM_MEMFAULT_METRICS=y

# Factory reset the modem - helpful for development when the modem may be in an unknown state.
CONFIG_SOFTSIM_FACTORY_RESET_ON_PROVISION=n

# Visual activity indicator: breathe the RGB LED's green channel on each LTE
# attach attempt (see src/main.c pulse_led1()). PWM LED driver only - the
# gpio-leds driver (CONFIG_LED_GPIO) stays off, so nothing else claims the pins.
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_PWM=y
# The gpio-leds node is status-okay too, so LED_GPIO auto-enables and would fight
# LED_PWM for the same pins (P0.29/30/31). We drive the LED via PWM only.
CONFIG_LED_GPIO=n

# Modem Configurations
CONFIG_NRF_MODEM_LIB=y

# NET Configurations
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# LTE Configurations
CONFIG_LTE_LINK_CONTROL=y
# Required by MEMFAULT_NCS_POST_COREDUMP_ON_NETWORK_CONNECTED
CONFIG_LTE_LC_PDN_MODULE=y
# LTE-M only: no NB-IoT/GNSS scanning, so churn re-attach times are
# deterministic and comparable cycle-to-cycle.
CONFIG_LTE_NETWORK_MODE_LTE_M=y
# Soak intent: stay online and awake - never request PSM/eDRX (these are the
# NCS defaults, stated explicitly so a default change can't sneak them in).
CONFIG_LTE_PSM_REQ=n
CONFIG_LTE_EDRX_REQ=n

# Shell instead of the AT host used by the flagship sample - both would claim
# uart0, and the `mflt` shell commands are the test surface here. AT commands
# are still available through the `at` shell command.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL=y
CONFIG_AT_SHELL=y

# Catch programming errors as Memfault-captured asserts instead of silent corruption
CONFIG_ASSERT=y

# --- Memfault ----------------------------------------------------------------
CONFIG_MEMFAULT=y
# Keep the key out of the public repo; inject it at build time:
#   west build ... -- -DCONFIG_MEMFAULT_NCS_PROJECT_KEY=\"<your key>\"
# An empty key fails the build on purpose (BUILD_ASSERT in the NCS integration)
# with a pointer to https://goto.memfault.com/create-key/nrf91
CONFIG_MEMFAULT_NCS_PROJECT_KEY=""

# Device ID = IMEI (MEMFAULT_NCS_DEVICE_ID_HW_ID is the default ID source)
CONFIG_HW_ID_LIBRARY_SOURCE_IMEI=y

# HTTPS upload; root CAs are provisioned to modem sec tags 1001-1005 at first boot
CONFIG_MEMFAULT_HTTP_ENABLE=y
CONFIG_MEMFAULT_PERIODIC_UPLOAD=y
CONFIG_MEMFAULT_ROOT_CERT_STORAGE_NRF_MODEM=y
CONFIG_MODEM_KEY_MGMT=y

# Metrics: LTE (time-to-connect, connection losses) and per-thread stack usage
CONFIG_MEMFAULT_NCS_LTE_METRICS=y
CONFIG_MODEM_INFO=y
CONFIG_MEMFAULT_NCS_STACK_METRICS=y

# Capture Zephyr logs in a RAM ring and upload the ring on every periodic
# pass (it wraps, so each upload carries the most-recent ~16 KB window -
# self-limiting on LTE bandwidth). Per-level log-volume metrics are free.
CONFIG_MEMFAULT_LOGGING_ENABLE=y
CONFIG_MEMFAULT_LOGGING_RAM_SIZE=16384
CONFIG_MEMFAULT_HTTP_PERIODIC_UPLOAD_LOGS=y
CONFIG_MEMFAULT_METRICS_LOGS_ENABLE=y

# Evaluation cadence: 5-min heartbeats and uploads (defaults are 3600 s)
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=300
CONFIG_MEMFAULT_HTTP_PERIODIC_UPLOAD_INTERVAL_SECS=300

# Coredump quality: all thread stacks, .bss, heap statistics
CONFIG_MEMFAULT_COREDUMP_FULL_THREAD_STACKS=y
CONFIG_MEMFAULT_COREDUMP_COLLECT_BSS_REGIONS=y
CONFIG_MEMFAULT_HEAP_STATS=y

# Store coredumps in internal flash (Partition Manager auto-generates a
# 0x10000 MEMFAULT_STORAGE partition) and post them right after LTE attach
CONFIG_MEMFAULT_NCS_INTERNAL_FLASH_BACKED_COREDUMP=y
CONFIG_STREAM_FLASH=y
CONFIG_MEMFAULT_NCS_POST_COREDUMP_ON_NETWORK_CONNECTED=y

# `mflt` shell commands for exercising the integration (test crashes, export, post)
CONFIG_MEMFAULT_SHELL=y

# Software watchdog fed by the churn loop in main(); expiry asserts, so a hung
# loop produces a Memfault coredump + tracked reboot instead of a silent wedge.
CONFIG_MEMFAULT_SOFTWARE_WATCHDOG_TIMEOUT_SECS=120

# --- TF-M ---------------------------------------------------------------------
# Reduce the size of TF-M by disabling the PS
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=n

# Reduce the size of the TF-M partition
# when combined with static partitioning
CONFIG_PM_PARTITION_SIZE_TFM=0x10000

# The bootloader adds a small mcuboot_pad partition,
# whose size must be subtracted from the TF-M partition
#CONFIG_BOOTLOADER_MCUBOOT=y
#CONFIG_PM_PARTITION_SIZE_TFM=0xfe00
